name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.preset }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [x86-hook-debug, x64-debug]
    steps:
      - uses: actions/checkout@v7
      - name: Configure and build
        shell: cmd
        run: tools\build.bat ${{ matrix.preset }}
      - name: Coverage table is up to date
        if: matrix.preset == 'x86-hook-debug'
        run: python tools/coverage.py --check

  checks:
    name: Repository checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: No game binaries or oversized files
        run: python tools/check_repo.py
      - name: Python tools compile
        run: python -m compileall -q tools
      - name: Install pinned clang-format
        run: python -m pip install --disable-pip-version-check clang-format==20.1.8
      - name: C++ formatting
        run: python tools/format.py --check
