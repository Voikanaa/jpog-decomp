name: CI

# Build and test. The `changes` job skips the builds when a change only touches documentation
# (checks.yml still runs on it), and the `CI` job sums up the result; it is the required status
# check for main, so it must report on every change, docs-only ones included. A newer push to a PR
# branch cancels the run it supersedes, while every push to main runs to completion.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Headers the vendored SDL3 (X11, Wayland, audio) and bgfx (OpenGL/EGL) build against on Linux.
  LINUX_DEV_PACKAGES: >-
    libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev
    libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev
    libgl1-mesa-dev libasound2-dev libpulse-dev libdbus-1-dev libudev-dev

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # Manual runs, new branches and force pushes (no usable base) build everything.
          code=true
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BASE...$HEAD" | grep -qvE '\.md$|^docs/|^LICENSE$|^\.github/ISSUE_TEMPLATE/'; then
              code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.preset }}${{ matrix.cc && format(', {0}', matrix.cc) || '' }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, preset: x86-debug }
          - { os: windows-latest, preset: x64-debug }
          - { os: windows-latest, preset: x64-release }
          - { os: ubuntu-latest, preset: linux-debug, cc: gcc, cxx: g++ }
          - { os: ubuntu-latest, preset: linux-release, cc: clang, cxx: clang++ }
          - { os: ubuntu-latest, preset: linux-asan }
          - { os: macos-latest, preset: macos-debug }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install Ninja and platform headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ env.LINUX_DEV_PACKAGES }}
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure, build and test
        shell: bash
        run: |
          # sccache cannot cache MSVC's separate PDBs; embed the debug info instead.
          extra=""
          if [ "$RUNNER_OS" = "Windows" ]; then extra="-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded"; fi
          python tools/build.py ${{ matrix.preset }} --keep-going -DJPOG_WERROR=ON $extra
      - name: Coverage table is up to date
        if: matrix.preset == 'x86-debug'
        run: python tools/coverage.py --check

  clang-tidy:
    name: clang-tidy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy ${{ env.LINUX_DEV_PACKAGES }}
      - name: Configure
        run: cmake --preset linux-debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: clang-tidy
        # Shaders.cpp includes headers generated at build time; this job only configures.
        run: run-clang-tidy -quiet -p build/linux-debug "$PWD/src/(?!shell/Shaders\.cpp)"

  ci:
    name: CI
    needs: [changes, build, clang-tidy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed or were skipped for a docs-only change
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.build.result }} ${{ needs.clang-tidy.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "changes build clang-tidy: $RESULTS (code changed: $CODE)"
          if [ "$CODE" = "true" ]; then expected="success success success"; else expected="success skipped skipped"; fi
          [ "$RESULTS" = "$expected" ]
