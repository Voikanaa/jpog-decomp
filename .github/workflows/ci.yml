name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Headers the vendored SDL3 (X11, Wayland, audio) and bgfx (OpenGL/EGL) build against on Linux.
  LINUX_DEV_PACKAGES: >-
    libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev
    libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev
    libgl1-mesa-dev libasound2-dev libpulse-dev libdbus-1-dev libudev-dev

jobs:
  build:
    name: Build (${{ matrix.preset }}${{ matrix.cc && format(', {0}', matrix.cc) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, preset: x86-debug }
          - { os: windows-latest, preset: x64-debug }
          - { os: windows-latest, preset: x64-release }
          - { os: ubuntu-latest, preset: linux-debug, cc: gcc, cxx: g++ }
          - { os: ubuntu-latest, preset: linux-release, cc: clang, cxx: clang++ }
          - { os: ubuntu-latest, preset: linux-asan }
          - { os: macos-latest, preset: macos-debug }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install Ninja and platform headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ env.LINUX_DEV_PACKAGES }}
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure, build and test
        shell: bash
        run: |
          # sccache cannot cache MSVC's separate PDBs; embed the debug info instead.
          extra=""
          if [ "$RUNNER_OS" = "Windows" ]; then extra="-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded"; fi
          python tools/build.py ${{ matrix.preset }} --keep-going -DJPOG_WERROR=ON $extra
      - name: Coverage table is up to date
        if: matrix.preset == 'x86-debug'
        run: python tools/coverage.py --check

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy ${{ env.LINUX_DEV_PACKAGES }}
      - name: Configure
        run: cmake --preset linux-debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: clang-tidy
        # Shaders.cpp includes headers generated at build time; this job only configures.
        run: run-clang-tidy -quiet -p build/linux-debug "$PWD/src/(?!shell/Shaders\.cpp)"

  checks:
    name: Repository checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: No game binaries or oversized files
        run: python tools/check_repo.py
      - name: Python tools compile
        run: python -m compileall -q tools
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install pinned dev tools
        run: uv sync --locked
      - name: C++ formatting
        run: uv run tools/format.py --check
      - name: Python lint
        run: uv run ruff check tools
